<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clock</title>
<link rel="icon" href="clock.svg" type="image/svg+xml">
<style>
:root {color-scheme:light dark}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
body{margin:0;min-height:100dvh;background:linear-gradient(135deg,light-dark(#f5f7fa,#1e1e2f),light-dark(#c3cfe2,#2c3e50));color:light-dark(#222635,#fff);font:1rem system-ui,sans-serif}
.panel,.card{background:light-dark(#ffffff9e,#ffffff12);box-shadow:0 12px 32px #0002;backdrop-filter:blur(12px)}
.controls{position:absolute;top:1rem;right:1rem;display:grid;gap:.55rem;width:10rem}
.panel{border-radius:999px;display:flex;padding:4px;gap:2px}
button,input{font:inherit;color:inherit;border:0;background:transparent}
button{flex:1;display:grid;place-items:center;height:34px;border-radius:999px;cursor:pointer}
button[aria-pressed=true]{background:light-dark(#fff,#ffffff30)}
button:disabled{opacity:.35;cursor:default}
button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
input{width:100%;min-width:0;padding:.35rem .65rem;font-size:.8rem}
.card{text-align:center;border-radius:24px;box-sizing:border-box;width:min(50vw, calc(100vw - 2rem));container-type:inline-size;padding:clamp(1rem,4vw,3rem);margin:0}
#digital{font-size:clamp(1.5rem,20cqw,16vh);font-variant-numeric:tabular-nums}
#analog{width:min(85cqw,52dvh);margin:auto}
#date{margin-top:.75rem}
#zone{margin-top:.4rem;opacity:.68;font-size:.85rem;overflow-wrap:anywhere}
@media (max-width: 640px) {
    .card {width:calc(100vw - 2rem)}
}

.card {position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);display:grid;grid-template-rows:1fr auto 1fr}
.card::before {content:"";grid-row:1;grid-column:1}
#digital,#analog {grid-row:2;grid-column:1}
.details {grid-row:3;grid-column:1}
.controls {z-index:1}
</style>
<aside class="controls">
<div class="panel" role="group" aria-label="Clock display">
<button type="button" data-mode="digital" aria-pressed="true" aria-label="Digital" title="Digital"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M7 9v6m5-5v.1m0 3.9v.1m5-5v6"/></svg></button>
<button type="button" data-mode="analog" aria-pressed="false" aria-label="Analog" title="Analog"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></svg></button>
<button type="button" disabled aria-label="Wheel, coming soon" title="Wheel, coming soon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18m-6-15 12 12M18 6 6 18"/></svg></button>
</div>
<div class="panel" role="group" aria-label="Color theme">
<button type="button" data-theme-choice="system" aria-pressed="true" aria-label="Follow system" title="Follow system"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v4m-4 0h8"/></svg></button>
<button type="button" data-theme-choice="light" aria-pressed="false" aria-label="Light" title="Light"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19m0-14-1.5 1.5m-11 11L5 19"/></svg></button>
<button type="button" data-theme-choice="dark" aria-pressed="false" aria-label="Dark" title="Dark"><svg viewBox="0 0 24 24"><path d="M20.5 15A9 9 0 0 1 9 3.5 9 9 0 1 0 20.5 15Z"/></svg></button>
</div>
<div class="panel"><input id="timezone" list="zones" aria-label="Search time zones" placeholder="System time zone" autocomplete="off"><datalist id="zones"></datalist></div>
</aside>
<main class="card" style="visibility:hidden">
<div id="digital"></div>
<div id="analog" hidden>
<svg viewBox="0 0 240 240" role="img" aria-label="Analog clock">
<circle cx="120" cy="120" r="118" fill="light-dark(#fff,#18191f)" stroke="currentColor" stroke-opacity=".18"/>
<g id="dial"></g>
<g stroke-linecap="round">
<path id="hour" d="M120 126V66" stroke="currentColor" stroke-width="6"/>
<path id="minute" d="M120 128V42" stroke="currentColor" stroke-width="4"/>
<path id="second" d="M120 142V31" stroke="#ff9500" stroke-width="2"/>
</g>
<circle cx="120" cy="120" r="4" fill="#ff9500"/>
</svg>
</div>
<div class="details"><div id="date"></div>
<div id="zone"></div></div>
</main>
<script>
const find = id => document.getElementById(id);
const systemLabel = "System time zone";
const options = [systemLabel, "UTC", ...Intl.supportedValuesOf("timeZone")];
for (const value of options) find("zones").append(new Option(value));
let timeZone;
find("timezone").addEventListener("input", event => {
    const value = event.target.value.trim();
    if (!value || value === systemLabel) timeZone = undefined;
    else if (options.includes(value)) timeZone = value;
    else return;
    update();
});
find("timezone").addEventListener("blur", () => {
    find("timezone").value = timeZone ?? "";
});
function bindSegments(selector, choose) {
    const buttons = document.querySelectorAll(selector);
    for (const button of buttons) button.addEventListener("click", () => {
        for (const item of buttons) item.setAttribute("aria-pressed", item === button);
        choose(button.dataset);
    });
}
bindSegments("[data-theme-choice]", ({themeChoice}) => {
    if (themeChoice === "system") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = themeChoice;
});
bindSegments("[data-mode]", ({mode}) => {
    find("digital").hidden = mode !== "digital";
    find("analog").hidden = mode !== "analog";
});
for (let tick = 0; tick < 60; tick++) {
    const major = tick % 5 === 0;
    const angle = tick * Math.PI / 30;
    const mark = document.createElementNS("http://www.w3.org/2000/svg", "line");
    for (const [name, value] of Object.entries({
        x1:120, y1:10, x2:120, y2:major ? 18 : 14,
        transform:`rotate(${tick * 6} 120 120)`, stroke:"currentColor",
        "stroke-opacity":major ? .75 : .32
    })) mark.setAttribute(name, value);
    find("dial").append(mark);
    if (major) {
        const number = document.createElementNS(mark.namespaceURI, "text");
        number.setAttribute("x", 120 + 86 * Math.sin(angle));
        number.setAttribute("y", 120 - 86 * Math.cos(angle));
        number.setAttribute("text-anchor", "middle");
        number.setAttribute("dominant-baseline", "central");
        number.setAttribute("fill", "currentColor");
        number.setAttribute("font-size", "19");
        number.textContent = tick / 5 || 12;
        find("dial").append(number);
    }
}
function update() {
    const now = new Date();
    const formatter = new Intl.DateTimeFormat("en-GB", {
        timeZone, hourCycle:"h23", hour:"2-digit", minute:"2-digit", second:"2-digit"
    });
    const time = formatter.format(now);
    const [h,m,s] = time.split(":").map(Number);
    find("digital").textContent = time;
    for (const [id, angle] of [["hour", h * 30 + m / 2], ["minute", m * 6 + s / 10], ["second", s * 6]]) {
        find(id).setAttribute("transform", `rotate(${angle} 120 120)`);
    }
    find("date").textContent = new Intl.DateTimeFormat("en-GB", {timeZone, dateStyle:"full"}).format(now);
    find("zone").textContent = formatter.resolvedOptions().timeZone.replaceAll("_", " ");
}
update();
document.querySelector(".card").style.removeProperty("visibility");
setInterval(update, 1000);
</script>
