<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clock</title>
<link rel="icon" href="clock.svg" type="image/svg+xml">
<style>
:root {color-scheme:light dark}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
body{margin:0;min-height:100dvh;background:linear-gradient(135deg,light-dark(#f5f7fa,#1e1e2f),light-dark(#c3cfe2,#2c3e50));color:light-dark(#222635,#fff);font:1rem system-ui,sans-serif}
.panel,.card{background:light-dark(#ffffff9e,#ffffff12);box-shadow:0 12px 32px #0002;backdrop-filter:blur(12px)}
.controls{position:absolute;top:1rem;right:1rem;display:grid;gap:.55rem;width:10rem}
.panel{border-radius:999px;display:flex;padding:4px;gap:2px}
button,input{font:inherit;color:inherit;border:0;background:transparent}
button{flex:1;display:grid;place-items:center;height:34px;border-radius:999px;cursor:pointer}
button[aria-pressed=true]{background:light-dark(#fff,#ffffff30)}
button:disabled{opacity:.35;cursor:default}
button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
input{width:100%;min-width:0;padding:.35rem .65rem;font-size:.8rem}
.card{text-align:center;border-radius:24px;box-sizing:border-box;width:min(50vw, calc(100vw - 2rem));container-type:inline-size;padding:clamp(1rem,4vw,3rem);margin:0}
#digital{font-size:clamp(1.5rem,20cqw,16vh);font-variant-numeric:tabular-nums}
#analog{width:min(85cqw,52dvh);margin:auto}
#date{margin-top:.75rem}
#zone{margin-top:.4rem;opacity:.68;font-size:.85rem;overflow-wrap:anywhere}
@media (max-width: 640px) {
    .card {width:calc(100vw - 2rem)}
}

.card {position:fixed;top:50%;left:50%;transform:translate(-50%,-50%)}

#digital {line-height:1.08}

.controls {z-index:1}
#zone-trigger{display:flex;align-items:center;justify-content:space-between;gap:.4rem;padding:0 .65rem;min-width:0;font-size:.8rem}
#zone-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#zone-trigger svg{flex:none;width:14px}
#zone-picker{position:absolute;top:calc(100% + .5rem);right:0;display:grid;box-sizing:border-box;width:min(20rem,calc(100vw - 2rem));border-radius:18px;padding:.55rem;background:light-dark(#f9fafc,#282d3f)}
#zone-picker[hidden],#zones button[hidden]{display:none}
#timezone{box-sizing:border-box;min-height:44px;font-size:16px;border-radius:12px;background:light-dark(#e9edf4,#ffffff14)}
#zones{max-height:clamp(3rem,calc(100dvh - 15rem),18rem);overflow:auto;overscroll-behavior:contain}
#zones button{display:block;width:100%;height:auto;min-height:44px;padding:.5rem .65rem;text-align:left;overflow-wrap:anywhere;font-size:.9rem}
#no-zones{padding:0 .65rem;font-size:.9rem}
@media (pointer:coarse){#zone-trigger{height:44px}}
#wheel{width:min(100%,74dvh);margin:auto}
#wheel svg{display:block;width:100%;overflow:visible}
.wheel-ring{transition:transform .65s ease-out}
.wheel-ring text{fill:currentColor;opacity:.52;font-size:15px;font-variant-numeric:tabular-nums}
.wheel-ring text.current{fill:light-dark(#0959ae,#83c6ff);opacity:1;font-size:32px;font-weight:750}
@media (prefers-reduced-motion:reduce){.wheel-ring{transition:none}}
.card:has(#wheel:not([hidden])){width:min(64vw,calc(100vw - 2rem));padding:clamp(.75rem,2vw,1.75rem)}
@media (max-width:640px){
    .card:has(#wheel:not([hidden])){width:calc(100vw - 1rem)}
}
.wheel-unit{fill:currentColor;opacity:.72;font-size:17px}
</style>
<aside class="controls">
<div class="panel" role="group" aria-label="Clock display">
<button type="button" data-mode="digital" aria-pressed="true" aria-label="Digital" title="Digital"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M7 9v6m5-5v.1m0 3.9v.1m5-5v6"/></svg></button>
<button type="button" data-mode="analog" aria-pressed="false" aria-label="Analog" title="Analog"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></svg></button>
<button type="button" data-mode="wheel" aria-pressed="false" aria-label="Wheel" title="Wheel"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18m-6-15 12 12M18 6 6 18"/></svg></button>
</div>
<div class="panel" role="group" aria-label="Color theme">
<button type="button" data-theme-choice="system" aria-pressed="true" aria-label="Follow system" title="Follow system"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v4m-4 0h8"/></svg></button>
<button type="button" data-theme-choice="light" aria-pressed="false" aria-label="Light" title="Light"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19m0-14-1.5 1.5m-11 11L5 19"/></svg></button>
<button type="button" data-theme-choice="dark" aria-pressed="false" aria-label="Dark" title="Dark"><svg viewBox="0 0 24 24"><path d="M20.5 15A9 9 0 0 1 9 3.5 9 9 0 1 0 20.5 15Z"/></svg></button>
</div>
<div class="panel"><button id="zone-trigger" type="button" aria-expanded="false" aria-controls="zone-picker"><span id="zone-label">System time zone</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
<section id="zone-picker" class="panel" hidden aria-label="Choose time zone">
<input id="timezone" type="search" aria-label="Search time zones" placeholder="Search time zones" autocomplete="off">
<div id="zones"></div>
<p id="no-zones" hidden>No matching time zones</p>
</section>
</aside>
<main class="card" style="visibility:hidden">
<div id="digital"></div>
<div id="analog" hidden>
<svg viewBox="0 0 240 240" role="img" aria-label="Analog clock">
<circle cx="120" cy="120" r="118" fill="light-dark(#fff,#18191f)" stroke="currentColor" stroke-opacity=".18"/>
<g id="dial"></g>
<g stroke-linecap="round">
<path id="hour" d="M120 126V66" stroke="currentColor" stroke-width="6"/>
<path id="minute" d="M120 128V42" stroke="currentColor" stroke-width="4"/>
<path id="second" d="M120 142V31" stroke="#ff9500" stroke-width="2"/>
</g>
<circle cx="120" cy="120" r="4" fill="#ff9500"/>
</svg>
</div>
<div id="wheel" hidden><svg viewBox="-320 -320 640 640" role="img" aria-label="Time wheel"></svg></div><div class="details"><div id="date"></div>
<div id="zone"></div></div>
</main>
<script>
const find = id => document.getElementById(id);
const systemLabel = "System time zone";
const options = [systemLabel, "UTC", ...Intl.supportedValuesOf("timeZone")];
const trigger = find("zone-trigger");
const picker = find("zone-picker");
const search = find("timezone");
let timeZone;
function closePicker(restoreFocus) {
    picker.hidden = true;
    trigger.setAttribute("aria-expanded", "false");
    if (restoreFocus) trigger.focus();
}
const zoneButtons = options.map(value => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = value.replaceAll("_", " ");
    button.setAttribute("aria-pressed", value === systemLabel);
    button.addEventListener("click", () => {
        timeZone = value === systemLabel ? undefined : value;
        find("zone-label").textContent = button.textContent;
        for (const item of zoneButtons) item.setAttribute("aria-pressed", item === button);
        closePicker(true);
        update();
    });
    find("zones").append(button);
    return button;
});
function filterZones() {
    const query = search.value.trim().toLowerCase().replaceAll("_", " ");
    let matches = 0;
    for (const button of zoneButtons) {
        button.hidden = !button.textContent.toLowerCase().includes(query);
        if (!button.hidden) matches++;
    }
    find("no-zones").hidden = matches > 0;
    find("zones").scrollTop = 0;
}
search.addEventListener("input", filterZones);
trigger.addEventListener("click", () => {
    if (!picker.hidden) {
        closePicker(false);
        return;
    }
    search.value = "";
    filterZones();
    picker.hidden = false;
    trigger.setAttribute("aria-expanded", "true");
    if (matchMedia("(pointer:fine)").matches) search.focus();
});
document.addEventListener("pointerdown", event => {
    if (!picker.hidden && !picker.contains(event.target) && !trigger.contains(event.target)) closePicker(false);
});
document.addEventListener("keydown", event => {
    if (event.key === "Escape" && !picker.hidden) closePicker(true);
});

function bindSegments(selector, choose) {
    const buttons = document.querySelectorAll(selector);
    for (const button of buttons) button.addEventListener("click", () => {
        for (const item of buttons) item.setAttribute("aria-pressed", item === button);
        choose(button.dataset);
    });
}
bindSegments("[data-theme-choice]", ({themeChoice}) => {
    if (themeChoice === "system") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = themeChoice;
});
bindSegments("[data-mode]", ({mode}) => {
    find("digital").hidden = mode !== "digital";
    find("analog").hidden = mode !== "analog";
    find("wheel").hidden = mode !== "wheel";
    update();
});
for (let tick = 0; tick < 60; tick++) {
    const major = tick % 5 === 0;
    const angle = tick * Math.PI / 30;
    const mark = document.createElementNS("http://www.w3.org/2000/svg", "line");
    for (const [name, value] of Object.entries({
        x1:120, y1:10, x2:120, y2:major ? 18 : 14,
        transform:`rotate(${tick * 6} 120 120)`, stroke:"currentColor",
        "stroke-opacity":major ? .75 : .32
    })) mark.setAttribute(name, value);
    find("dial").append(mark);
    if (major) {
        const number = document.createElementNS(mark.namespaceURI, "text");
        number.setAttribute("x", 120 + 86 * Math.sin(angle));
        number.setAttribute("y", 120 - 86 * Math.cos(angle));
        number.setAttribute("text-anchor", "middle");
        number.setAttribute("dominant-baseline", "central");
        number.setAttribute("fill", "currentColor");
        number.setAttribute("font-size", "19");
        number.textContent = tick / 5 || 12;
        find("dial").append(number);
    }
}
let calibration;
let syncing = false;
async function syncClock() {
    if (syncing || !navigator.onLine) return;
    syncing = true;
    const start = performance.now();
    try {
        const url = new URL("clock.svg", location.href);
        url.searchParams.set("sync", Date.now());
        const response = await fetch(url, {
            method: "HEAD", cache: "no-store", signal: AbortSignal.timeout(5000)
        });
        const end = performance.now();
        const serverTime = Date.parse(response.headers.get("Date"));
        if (!response.ok || !Number.isFinite(serverTime) || Number(response.headers.get("Age")) > 0) {
            throw new Error("No fresh server time");
        }
        calibration = {time: serverTime + 500 + (end - start) / 2, measuredAt: end};
    } catch {
        calibration = undefined;
    } finally {
        syncing = false;
        update();
    }
}
window.addEventListener("offline", () => {
    calibration = undefined;
    update();
});
window.addEventListener("online", syncClock);
document.addEventListener("visibilitychange", () => {
    if (!document.hidden) syncClock();
});
setInterval(syncClock, 5 * 60 * 1000);
const wheelSVG = find("wheel").querySelector("svg");
const svgElement = name => document.createElementNS(wheelSVG.namespaceURI, name);
const labels = (count, format) => Array.from({length:count}, (_, index) => format(index));
const twoDigits = number => String(number).padStart(2, "0");
const rings = [
    labels(24, twoDigits),
    labels(60, twoDigits),
    labels(60, twoDigits)
].map((values, ringIndex) => {
    const group = svgElement("g");
    group.classList.add("wheel-ring");
    const nodes = values.map((value, index) => {
        const text = svgElement("text");
        text.textContent = value;
        text.setAttribute("x", 86 + ringIndex * 86);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("dominant-baseline", "central");
        text.setAttribute("transform", "rotate(" + index * 360 / values.length + ")");
        group.append(text);
        return text;
    });
    wheelSVG.append(group);
    return {group, nodes, angle:0, current:undefined};
});
["h", "min", "s"].forEach((unit, index) => {
    const label = svgElement("text");
    label.classList.add("wheel-unit");
    label.setAttribute("x", 129 + index * 86);
    label.setAttribute("text-anchor", "middle");
    label.setAttribute("dominant-baseline", "central");
    label.textContent = unit;
    wheelSVG.append(label);
});
function updateWheel(h, m, s) {
    if (find("wheel").hidden) return;
    [h, m, s]
        .forEach((index, ringIndex) => {
            const ring = rings[ringIndex];
            if (ring.current === index) return;
            const step = 360 / ring.nodes.length;
            if (ring.current === undefined) {
                ring.angle = -index * step;
            } else {
                const count = ring.nodes.length;
                const difference = (index - ring.current + count) % count;
                ring.angle -= (difference > count / 2 ? difference - count : difference) * step;
                ring.nodes[ring.current].classList.remove("current");
            }
            ring.group.style.transform = "rotate(" + ring.angle + "deg)";
            ring.nodes[index].classList.add("current");
            ring.current = index;
        });
}
function update() {
    const now = navigator.onLine && calibration
        ? new Date(calibration.time + performance.now() - calibration.measuredAt)
        : new Date();
    const formatter = new Intl.DateTimeFormat("en-GB", {
        timeZone, hourCycle:"h23", hour:"2-digit", minute:"2-digit", second:"2-digit"
    });
    const time = formatter.format(now);
    const [h,m,s] = time.split(":").map(Number);
    find("digital").textContent = time;
    updateWheel(h, m, s);
    for (const [id, angle] of [["hour", h * 30 + m / 2], ["minute", m * 6 + s / 10], ["second", s * 6]]) {
        find(id).setAttribute("transform", `rotate(${angle} 120 120)`);
    }
    find("date").textContent = new Intl.DateTimeFormat("en-GB", {timeZone, dateStyle:"full"}).format(now);
    find("zone").textContent = formatter.resolvedOptions().timeZone.replaceAll("_", " ");
}
update();
document.querySelector(".card").style.removeProperty("visibility");
setInterval(update, 100);
syncClock();
</script>
